<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050506" />
    <title>404 — Sayfa bulunamadı · Page not found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; background: #050506; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
        font-family: Archivo, "Helvetica Neue", Arial, sans-serif; color: #F4F4F4;
        background: radial-gradient(700px 480px at 50% 115%, rgba(227, 25, 55, .35), transparent 70%), #050506;
      }
      .code { font-size: clamp(88px, 22vw, 180px); font-weight: 800; letter-spacing: -.04em; line-height: 1; color: #E31937; }
      h1 { margin-top: 8px; font-size: clamp(22px, 4vw, 32px); font-weight: 700; }
      p { margin-top: 10px; color: #A3A7AE; font-size: 17px; }
      a { display: inline-block; margin-top: 28px; padding: 14px 26px; border-radius: 999px; background: #E31937; color: #fff; font-weight: 700; text-decoration: none; }
      a:hover { background: #FF3B52; }
      a:focus-visible { outline: 2px solid #FF3B52; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>Sayfa bulunamadı</h1>
      <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir.</p>
      <p lang="en">Page not found — it may have moved or never existed.</p>
      <a href="/tesla-roadster-info/">Ana sayfaya dön · Back to home</a>
